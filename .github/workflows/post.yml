name: post-to-x
on:
  schedule:
    - cron: "7 * * * *"   # 毎時7分に、出す時刻が来た投稿があるか見る
  push:
    branches: [main]
    paths: [".github/check-keys"]   # このファイルを更新すると、キーの確認だけが走る
  workflow_dispatch:
    inputs:
      mode:
        description: "post(期限の来た投稿を出す) / check(キーの確認だけ)"
        default: check
        type: choice
        options: [check, post]
permissions:
  contents: write
concurrency: post-to-x
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests requests-oauthlib
      - name: post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/post_x.py ${{ github.event_name == 'push' && 'check' || github.event.inputs.mode || 'post' }}
      - name: instagram
        env:
          IG_USER_ID: "17841449489547980"   # @yomigaere_dodo の番号(秘密ではない)
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/post_ig.py ${{ github.event_name == 'push' && 'check' || github.event.inputs.mode || 'post' }}
      - name: record
        run: |
          git config user.name "yomigaere-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || (git commit -m "posted" && git pull --rebase && git push)
