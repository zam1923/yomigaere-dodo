name: x-inbox
on:
  schedule:
    - cron: "37 10 * * *"   # 毎日 19:37 JST に、XのリプライとInstagramのコメントを取ってくる(返信は Claude が毎日の作業で書く)
  push:
    branches: [main]
    paths: [".github/check-inbox"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: post-to-x
jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests requests-oauthlib
      - env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/x_inbox.py
      - env:
          IG_USER_ID: "17841449489547980"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/post_ig.py inbox
      - run: |
          git config user.name "yomigaere-bot"; git config user.email "bot@users.noreply.github.com"
          git add inbox; git diff --cached --quiet || (git commit -m "x inbox" && git pull --rebase && git push)
